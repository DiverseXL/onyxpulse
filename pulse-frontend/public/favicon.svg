<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pulseGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#143e75" />
      <stop offset="55%" stop-color="#0d2b52" />
      <stop offset="100%" stop-color="#061528" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle
    cx="32"
    cy="32"
    r="29"
    fill="url(#pulseGrad)"
    stroke="#F2EDE1"
    stroke-opacity="0.32"
    stroke-width="1.75"
    filter="url(#subtleGlow)"
  />

  <!-- Pulse Upward Waves (scaled & centered) -->
  <g transform="translate(13, 13) scale(1.583)">
    <!-- Lower shadow wave -->
    <path
      d="M3 20C7 20 9 15 13 15C17 15 18 10 21 10"
      stroke="#F2EDE1"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-opacity="0.45"
    />
    <!-- Primary upper wave -->
    <path
      d="M3 17C7 17 8 11 13 11C18 11 18 5 21 5"
      stroke="#F2EDE1"
      stroke-width="2.6"
      stroke-linecap="round"
    />
  </g>
</svg>
